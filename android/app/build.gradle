apply plugin: 'com.android.application'

android {
    namespace = "pl.tomagro.aleksanderuczesie"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.tomagro.aleksanderuczesie"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        compatibleRelease {
            // Keep the certificate of the APK already installed on Aleksander's phone.
            // The private key stays outside the repository; no new key is generated.
            storeFile file(System.getenv('ALEKSANDER_SIGNING_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.compatibleRelease
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Fail before a release is built if this machine supplies a different signing key.
tasks.register('verifyCompatibleReleaseKey') {
    doLast {
        def signing = android.signingConfigs.compatibleRelease
        if (!signing.storeFile.isFile()) throw new GradleException('The original APK signing key is missing.')
        def keyStore = java.security.KeyStore.getInstance(signing.storeFile, signing.storePassword.toCharArray())
        def certificate = keyStore.getCertificate(signing.keyAlias)
        if (certificate == null || !keyStore.isKeyEntry(signing.keyAlias)) throw new GradleException('The original signing key is unavailable.')
        def fingerprint = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
        if (fingerprint != '65785790e4ddd76fb5cb1b1c71386c1b13c37fb25804252a5217f771f7f8b359') {
            throw new GradleException('Signing certificate differs from the existing APK. Release build stopped.')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.dependsOn('verifyCompatibleReleaseKey')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Real JSON parser for release-validation tests; Android's JVM stubs do not implement it.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
